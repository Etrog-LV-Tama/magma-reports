<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>אתר הדיווחים של המגמה</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root { --bg:#f4f5f7; --card:#fff; --ink:#1c2430; --muted:#6b7686; --accent:#2f5d3a; --accent-soft:#e6f0e8; --warn:#a33; --warn-soft:#fbe4e4; --line:#e3e6ea; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:'Heebo',system-ui,sans-serif; background:var(--bg); color:var(--ink); min-height:100vh; }
  header { background:var(--accent); color:#fff; padding:14px 16px; position:sticky; top:0; z-index:10; }
  header h1 { font-size:1.15rem; font-weight:700; }
  nav { display:flex; gap:6px; margin-top:10px; overflow-x:auto; }
  nav button { flex:1; white-space:nowrap; border:0; border-radius:8px; padding:8px 10px; font-family:inherit; font-size:.9rem; font-weight:500; background:rgba(255,255,255,.18); color:#fff; cursor:pointer; }
  nav button.active { background:#fff; color:var(--accent); }
  main { padding:14px; max-width:720px; margin:0 auto; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; margin-bottom:14px; }
  input[type=text],input[type=search],select,textarea { width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:8px; font-family:inherit; font-size:1rem; background:#fff; }
  label { display:block; font-size:.88rem; font-weight:500; margin:12px 0 4px; }
  .btn { display:block; width:100%; margin-top:16px; padding:12px; border:0; border-radius:10px; background:var(--accent); color:#fff; font-family:inherit; font-size:1rem; font-weight:700; cursor:pointer; }
  .btn:disabled { opacity:.5; }
  table { width:100%; border-collapse:collapse; font-size:.92rem; margin-top:10px; }
  th,td { padding:9px 10px; border-bottom:1px solid var(--line); text-align:right; vertical-align:top; }
  th { color:var(--muted); font-weight:500; font-size:.78rem; }
  .badge { display:inline-block; padding:2px 9px; border-radius:99px; font-size:.76rem; font-weight:700; white-space:nowrap; }
  .badge.immediate { background:var(--warn-soft); color:var(--warn); }
  .badge.hours { background:var(--accent-soft); color:var(--accent); }
  .badge.shabbat { background:#3b2f5e; color:#fff; }
  .chat-log { display:flex; flex-direction:column; gap:8px; margin:12px 0; }
  .msg { max-width:88%; padding:10px 12px; border-radius:12px; font-size:.95rem; line-height:1.5; white-space:pre-wrap; }
  .msg.user { align-self:flex-start; background:var(--accent-soft); }
  .msg.bot { align-self:flex-end; background:#eef0f3; }
  .note { margin-top:10px; font-size:.8rem; color:var(--muted); }
  .ok-box { display:none; margin-top:12px; padding:10px 12px; background:var(--accent-soft); border:1px solid #c4dcc9; border-radius:8px; font-size:.9rem; }
  .err-box { display:none; margin-top:12px; padding:10px 12px; background:var(--warn-soft); border:1px solid #ecc; border-radius:8px; font-size:.9rem; color:var(--warn); }
  .review-flag { display:none; margin-top:10px; padding:8px 10px; background:#fff8e1; border:1px solid #f0dfa0; border-radius:8px; font-size:.82rem; color:#7a6520; }
  .trainee-card h3 { font-size:1rem; margin-bottom:6px; }
  .sub { font-size:.84rem; color:var(--muted); margin-top:3px; }
  .report-line { font-size:.85rem; padding:6px 0; border-bottom:1px dashed var(--line); }
  .report-line:last-child { border-bottom:0; }
  .empty { text-align:center; color:var(--muted); padding:24px 10px; font-size:.92rem; }
  footer { text-align:center; color:var(--muted); font-size:.75rem; padding:18px; }
  .hidden { display:none; }
  .spinner { color:var(--muted); text-align:center; padding:16px; font-size:.9rem; }
</style>
</head>
<body>
<header>
  <h1>אתר הדיווחים של המגמה</h1>
  <nav>
    <button class="active" data-tab="table">החטא ועונשו</button>
    <button data-tab="report">דיווח על תקלה</button>
    <button data-tab="summary">סיכום שבועי</button>
    <button data-tab="chat">שאלות</button>
  </nav>
</header>
<main>
  <section id="tab-table">
    <div class="card">
      <input type="search" id="table-search" placeholder="חיפוש בטבלה…" oninput="renderTable()">
      <div id="table-body"><div class="spinner">טוען…</div></div>
    </div>
  </section>

  <section id="tab-report" class="hidden">
    <div class="card">
      <label>הדבקת דיווח מוואטסאפ (אופציונלי)</label>
      <textarea id="paste" rows="4" placeholder="הדביקו כאן דיווח שלם והשדות יתמלאו לבד"></textarea>
      <div class="review-flag" id="review-flag">מיליתי את השדות אוטומטית — בדקו שהחלוקה נכונה לפני השליחה.</div>
      <label>תאריך (dd/mm)</label>
      <input type="text" id="f-date" placeholder="למשל 14/10" inputmode="numeric">
      <label>שם החניך</label>
      <input type="text" id="f-trainee" placeholder="שם מלא">
      <label>התקלה</label>
      <select id="f-violation"></select>
      <input type="text" id="f-violation-other" class="hidden" placeholder="כתבו את התקלה" style="margin-top:6px">
      <label>פרטים</label>
      <textarea id="f-details" rows="2" placeholder="מה קרה בדיוק"></textarea>
      <label>מדווח</label>
      <input type="text" id="f-reporter" placeholder="שם המפקד המדווח">
      <button class="btn" id="submit" onclick="submitReport()">שליחת דיווח</button>
      <div class="ok-box" id="ok-box"></div>
      <div class="err-box" id="err-box"></div>
    </div>
  </section>

  <section id="tab-summary" class="hidden">
    <div id="summary-body"><div class="spinner">טוען…</div></div>
  </section>

  <section id="tab-chat" class="hidden">
    <div class="card">
      <div class="chat-log" id="chat-log">
        <div class="msg bot">שאלו שאלה חופשית על "החטא ועונשו" — למשל מה העונש על תקלה מסוימת, או אם עונש צריך להיות מיידי.</div>
      </div>
      <input type="text" id="chat-in" placeholder="כתבו שאלה…" onkeydown="if(event.key==='Enter')sendChat()">
      <button class="btn" id="chat-btn" onclick="sendChat()">שליחה</button>
    </div>
  </section>
</main>
<footer id="footer">אתר הדיווחים של המגמה</footer>
<script>
const API = 'https://magma-reports-api.mqog1v.workers.dev';
let TABLE = [];

document.querySelectorAll('nav button').forEach(b => b.addEventListener('click', () => {
  document.querySelectorAll('nav button').forEach(x => x.classList.toggle('active', x === b));
  ['table','report','summary','chat'].forEach(t => document.getElementById('tab-'+t).classList.toggle('hidden', t !== b.dataset.tab));
  if (b.dataset.tab === 'summary') loadSummary();
}));

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtHours = h => h == null ? '' : h === 0.5 ? 'חצי שעה' : h === 1 ? 'שעה אחת' : h === 1.5 ? 'שעה וחצי' : h === 2 ? 'שעתיים' : h + ' שעות';
const kindLabel = r => r.kind === 'immediate' ? '<span class="badge immediate">מיידי</span>' : `<span class="badge hours">${fmtHours(r.hours) || 'שעות'}</span>`;

async function loadTable() {
  try {
    const d = await (await fetch(API + '/api/table')).json();
    TABLE = d.table || [];
  } catch (e) { TABLE = []; }
  renderTable();
  renderViolationOptions();
}

function renderTable() {
  const q = (document.getElementById('table-search').value || '').trim();
  const rows = TABLE.filter(r => !q || (r.offense + (r.note||'')).includes(q));
  const body = document.getElementById('table-body');
  if (!TABLE.length) { body.innerHTML = '<div class="empty">טבלת "החטא ועונשו" עוד לא נקלטה.</div>'; return; }
  if (!rows.length) { body.innerHTML = '<div class="empty">לא נמצאו תוצאות.</div>'; return; }
  body.innerHTML = '<table><tr><th>התקלה</th><th>סוג</th><th>פירוט</th></tr>' +
    rows.map(r => `<tr><td>${esc(r.offense)}</td><td>${kindLabel(r)}</td><td>${esc(r.note || '').replaceAll(' | ', '<br>')}</td></tr>`).join('') + '</table>';
}

function renderViolationOptions() {
  const sel = document.getElementById('f-violation');
  sel.innerHTML = '<option value="">— בחרו מהטבלה —</option>' +
    TABLE.map(r => `<option value="${esc(r.offense)}">${esc(r.offense)}</option>`).join('') +
    '<option value="__other__">אחר (כתוב ידנית)</option>';
  sel.onchange = () => document.getElementById('f-violation-other').classList.toggle('hidden', sel.value !== '__other__');
}

function getViolation() {
  const sel = document.getElementById('f-violation');
  return sel.value === '__other__' ? document.getElementById('f-violation-other').value.trim() : sel.value;
}

document.getElementById('paste').addEventListener('input', (e) => {
  const lines = e.target.value.split('\n').map(s => s.trim()).filter(Boolean);
  if (lines.length < 4) return;
  if (/^דיווח/.test(lines[0])) lines.shift();
  const dateIdx = lines.findIndex(l => /^\d{1,2}\/\d{1,2}$/.test(l));
  if (dateIdx === -1 || lines.length - dateIdx < 4) { document.getElementById('review-flag').style.display = 'block'; return; }
  document.getElementById('f-date').value = lines[dateIdx];
  document.getElementById('f-trainee').value = lines[dateIdx + 1] || '';
  const v = lines[dateIdx + 2] || '';
  const sel = document.getElementById('f-violation');
  const known = TABLE.some(r => r.offense === v);
  sel.value = known ? v : '__other__';
  document.getElementById('f-violation-other').classList.toggle('hidden', known);
  if (!known) document.getElementById('f-violation-other').value = v;
  document.getElementById('f-reporter').value = lines[lines.length - 1] || '';
  document.getElementById('f-details').value = lines.slice(dateIdx + 3, -1).join('\n');
  document.getElementById('review-flag').style.display = 'block';
});

async function submitReport() {
  const ok = document.getElementById('ok-box'), err = document.getElementById('err-box');
  ok.style.display = err.style.display = 'none';
  const body = {
    date: document.getElementById('f-date').value.trim(),
    trainee: document.getElementById('f-trainee').value.trim(),
    violation: getViolation(),
    details: document.getElementById('f-details').value.trim(),
    reporter: document.getElementById('f-reporter').value.trim(),
  };
  if (!body.date || !body.trainee || !body.violation || !body.reporter) {
    err.textContent = 'חסרים שדות: תאריך, שם החניך, התקלה ומדווח הם חובה.'; err.style.display = 'block'; return;
  }
  const btn = document.getElementById('submit');
  btn.disabled = true; btn.textContent = 'שולח…';
  try {
    const r = await fetch(API + '/api/reports', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || 'שגיאה');
    ok.textContent = 'הדיווח נקלט ✓'; ok.style.display = 'block';
    ['f-date','f-trainee','f-details','paste'].forEach(id => document.getElementById(id).value = '');
    document.getElementById('f-violation').value = '';
    document.getElementById('f-violation-other').classList.add('hidden');
    document.getElementById('review-flag').style.display = 'none';
  } catch (e) {
    err.textContent = e.message || 'השליחה נכשלה — בדקו חיבור ונסו שוב.'; err.style.display = 'block';
  }
  btn.disabled = false; btn.textContent = 'שליחת דיווח';
}

const fmtDate = iso => { const [y,m,d] = iso.split('-'); return `${d}/${m}`; };

async function loadSummary() {
  const body = document.getElementById('summary-body');
  body.innerHTML = '<div class="spinner">טוען…</div>';
  try {
    const d = await (await fetch(API + '/api/summary')).json();
    const w = d.window;
    let html = `<div class="card"><b>שבוע נוכחי (חמישי–רביעי):</b> ${fmtDate(w.from)} – ${fmtDate(w.to)}</div>`;
    if (!d.trainees.length) html += '<div class="card"><div class="empty">אין דיווחים השבוע.</div></div>';
    for (const t of d.trainees) {
      const p = t.reports.map(r => `<div class="report-line">${fmtDate(r.incident_date)} · ${esc(r.violation)}${r.matched ? '' : ' <span class="badge immediate">לא שויך לטבלה</span>'}<div class="sub">${esc(r.details || '')} — ${esc(r.reporter)}</div></div>`).join('');
      html += `<div class="card trainee-card"><h3>${esc(t.trainee)} ${
        t.shabbat ? '<span class="badge shabbat">שבת בבסיס</span>' : (t.total_hours ? `<span class="badge hours">${fmtHours(t.total_hours)}</span>` : '')
      }</h3>${p}${
        t.immediates.length ? `<div class="sub" style="margin-top:6px">עונשים מיידיים: ${t.immediates.map(esc).join(', ')}</div>` : ''
      }</div>`;
    }
    body.innerHTML = html;
  } catch (e) {
    body.innerHTML = '<div class="card"><div class="empty">טעינת הסיכום נכשלה. בדקו חיבור ונסו שוב.</div></div>';
  }
}

async function sendChat() {
  const inp = document.getElementById('chat-in');
  const q = inp.value.trim();
  if (!q) return;
  const log = document.getElementById('chat-log');
  log.insertAdjacentHTML('beforeend', `<div class="msg user">${esc(q)}</div>`);
  inp.value = '';
  const btn = document.getElementById('chat-btn');
  btn.disabled = true;
  log.insertAdjacentHTML('beforeend', '<div class="msg bot" id="thinking">…</div>');
  try {
    const r = await fetch(API + '/api/chat', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ question: q }) });
    const d = await r.json();
    document.getElementById('thinking').outerHTML = `<div class="msg bot">${esc(r.ok ? d.answer : (d.error || 'שגיאה'))}</div>`;
  } catch (e) {
    document.getElementById('thinking').outerHTML = '<div class="msg bot">התשובה נכשלה — נסו שוב.</div>';
  }
  btn.disabled = false;
  log.scrollTop = log.scrollHeight;
}

loadTable();
</script>
</body>
</html>
